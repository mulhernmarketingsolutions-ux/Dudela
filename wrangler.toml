name = "dudela"
main = "./dist/_worker.js/index.js"
compatibility_date = "2024-09-19"
compatibility_flags = ["nodejs_compat"]

[assets]
binding = "ASSETS"
directory = "./dist"

# Member area (magic-link login, Womb Watch posts, member questions) — see
# src/lib/db.ts and migrations/0001_init.sql. Already provisioned via the
# Cloudflare dashboard: D1 database "dudela" created, migrations/0001_init.sql
# applied (6 tables), bound to this Worker as "DB", and ADMIN_PASSWORD secret
# set for /admin/womb-watch. Nothing left to do here — this just needs to
# ship on the next deploy.
[[d1_databases]]
binding = "DB"
database_name = "dudela"
database_id = "13a7f296-441d-48be-9a54-380a0a816adf"

# Keeps Workers Logs on across deploys — the dashboard's Observability toggle
# is NOT persisted here by default and silently resets to disabled on every
# new deploy unless it's set in this file.
[observability.logs]
enabled = true
invocation_logs = true
